name: CheckStart
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  start:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | \
          sh -s -- -b "$RUNNER_TEMP/bin" v2.15.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run lint
        run: make lint
      - name: Run unit test
        run: go test ./...
      - name: Integration tests
        run: go test -tags=integration -run '^TestIntegration' -v -count=1 ./...
  deploy:
    needs: [start]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Checkout
        uses: actions/checkout@v3
      - name: Add server
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy on server
        run: |
          ssh ${{secrets.KEY_SERVER}} "
          cd ${{secrets.PROJECT_ROOT}} && \
          git fetch origin master && \
          git reset --hard origin/master && \
          make tracker-deploy-stop && \
          make tracker-deploy-run "